name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm ci
              env:
                PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
